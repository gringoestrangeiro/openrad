name: python

on:
  push:
    paths:
      - 'clients/python/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'clients/python/**'
      - '.github/workflows/python.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
