name: release-2.2.0-runtime-qualification

on:
  push:
    branches: ['release/2.2.0-candidates']
    paths:
      - '.github/workflows/release-2.2.0-runtime-qualification.yml'
      - 'clients/android/app/src/androidTest/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-tap-installer:
    name: Install actual TAP on disposable Windows runner
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Download exact CI installer and check SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40766845084 --repo mariananetto-sys/openrad --name openrad-2.2.0-windows-candidate --dir "$env:RUNNER_TEMP\openrad-installer"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve signed driver candidate' }
          $file = "$env:RUNNER_TEMP\openrad-installer\OpenRad-Setup-2.2.0.exe"
          $want = ((Get-Content "$file.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $got = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          if ($want -ne $got) { throw 'SHA256 mismatch' }
      - name: Install driver with NSIS and inspect native Windows TAP
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$env:RUNNER_TEMP\openrad-installer\OpenRad-Setup-2.2.0.exe"
          $installDir = 'C:\OpenRad-2.2.0-QA'
          $p = Start-Process -FilePath $setup -ArgumentList @('/S', '--no-launch', "/D=$installDir") -PassThru -Wait
          Write-Output "NSIS install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Real Windows TAP installer failed: $($p.ExitCode)" }
          foreach ($name in 'openrad.exe','openrad-desktop.exe','openrad-setup-helper.exe','Uninstall-OpenRad.exe') {
            if (-not (Test-Path (Join-Path $installDir $name))) { throw "Missing installed file $name" }
          }
          $tap = @(Get-NetAdapter -IncludeHidden | Where-Object { $_.Name -eq 'OpenRad' -and $_.InterfaceDescription -match 'TAP-Windows' })
          if ($tap.Count -ne 1) { throw "Expected exactly one OpenRad TAP adapter, got $($tap.Count)" }
          $tap | Format-List Name,InterfaceDescription,Status,InterfaceGuid,DriverInformation
          $drivers = @(Get-CimInstance Win32_PnPSignedDriver | Where-Object { $_.DeviceName -match 'TAP-Windows Adapter V9' })
          $drivers | Select-Object DeviceName,DriverVersion,IsSigned,Signer | Format-List
          if (@($drivers | Where-Object { $_.IsSigned }).Count -eq 0) { throw 'TAP driver not marked signed by Windows' }
          & "$installDir\openrad.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed --version' }
          Write-Output 'PASS: real installation, TAP PnP signature, adapter and CLI'
      - name: Uninstall on disposable runner
        if: always()
        run: |
          $uninstall='C:\OpenRad-2.2.0-QA\Uninstall-OpenRad.exe'
          if (Test-Path $uninstall) {
            $p=Start-Process -FilePath $uninstall -ArgumentList '/S' -PassThru -Wait
            Write-Output "NSIS uninstall exit code $($p.ExitCode)"
            if ($p.ExitCode -notin @(0,3010)) { throw "Uninstall failed $($p.ExitCode)" }
          }

  android-emulator:
    name: Android 14 real emulator startup and VPN service
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM on hosted runner
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo 'KVM unavailable'; exit 1; fi
      - name: Build APKs and run JVM unit tests
        working-directory: clients/android
        run: |
          ./scripts/setup-android-sdk.sh
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Boot Android 14 and run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 700
          script: |
            set -eu
            adb install -r clients/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.openrad.mobile.debug/com.openrad.mobile.MainActivity
            sleep 12
            adb shell pidof com.openrad.mobile.debug | grep -E '^[0-9]+'
            adb shell dumpsys package com.openrad.mobile.debug | grep -q 'com.openrad.mobile.vpn.OpenRadVpnService'
            cd clients/android
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openrad-2.2.0-android-emulator-results
          path: |
            clients/android/app/build/outputs/androidTest-results/
            clients/android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14

  protocol-loopback:
    name: Radmin-compatible protocol tests on local sockets (not official service)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - run: |
          cargo test --locked --test direct_transport -- --nocapture
          cargo test --locked --test network_management -- --nocapture
          cargo test --locked --test transport_io -- --nocapture
          cargo test --locked --test forwarding -- --nocapture
          echo 'PASS: synthetic local-socket protocol; no official Radmin peer claimed.'
