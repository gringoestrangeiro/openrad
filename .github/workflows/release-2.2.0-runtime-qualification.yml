name: OpenRad 2.4.5 RC1 native Windows installer qualification

on:
  workflow_dispatch:
    inputs:
      installer_run_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-tap-installation:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
      EXPECTED_SOURCE: ${{ inputs.source_commit }}
      INSTALL_DIR: C:\OpenRad-2.4.5-RC1-QA
    steps:
      - name: Download verified installer from exact candidate commit
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INSTALLER_RUN_ID -notmatch '^[0-9]+$' -or $env:EXPECTED_SOURCE -notmatch '^[a-f0-9]{40}$') { throw 'Invalid provenance input' }
          $stage = Join-Path $env:RUNNER_TEMP 'openrad-rc1-installer'
          $deadline = [DateTime]::UtcNow.AddMinutes(15)
          do {
            $run = gh run view $env:INSTALLER_RUN_ID --repo $env:GITHUB_REPOSITORY --json headSha,status,conclusion,jobs | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.headSha -ne $env:EXPECTED_SOURCE) { throw 'Candidate source mismatch' }
            $job = @($run.jobs | Where-Object { $_.name -eq 'windows-x86_64' })
            if ($job.Count -ne 1) { throw 'Expected a single Windows packaging job' }
            if ($job[0].status -eq 'completed') { break }
            if ([DateTime]::UtcNow -ge $deadline) { throw 'Packaging deadline exceeded' }
            Start-Sleep -Seconds 15
          } while ($true)
          if ($job[0].conclusion -ne 'success') { throw 'Windows packaging did not succeed' }
          gh run download $env:INSTALLER_RUN_ID --repo $env:GITHUB_REPOSITORY --name openrad-2.4.5-windows-candidate --dir $stage
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $setup = Join-Path $stage 'OpenRad-Setup-2.4.5.exe'
          $expected = ((Get-Content -LiteralPath "$setup.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash -ine $expected) { throw 'Installer checksum mismatch' }

      - name: Install actual TAP without launching or provisioning
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'openrad-rc1-installer\OpenRad-Setup-2.4.5.exe'
          if (Test-Path $env:INSTALL_DIR) { throw 'Unexpected prior installation' }
          if (@(Get-NetAdapter -IncludeHidden | Where-Object Name -eq 'OpenRad').Count) { throw 'Unexpected prior adapter' }
          $p = Start-Process -FilePath $setup -ArgumentList @('/S','--no-launch',"/D=$env:INSTALL_DIR") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          foreach ($file in 'openrad.exe','openrad-desktop.exe','openrad-setup-helper.exe','Uninstall-OpenRad.exe') {
            if (!(Test-Path (Join-Path $env:INSTALL_DIR $file) -PathType Leaf)) { throw "Missing $file" }
          }
          $adapters = @(Get-NetAdapter -IncludeHidden | Where-Object { $_.Name -eq 'OpenRad' -and $_.InterfaceDescription -match 'TAP-Windows' })
          if ($adapters.Count -ne 1) { throw 'Dedicated TAP adapter not installed' }
          $drivers = @(Get-CimInstance Win32_PnPSignedDriver | Where-Object { $_.DeviceName -match 'TAP-Windows Adapter V9' -and $_.IsSigned })
          if (!$drivers.Count) { throw 'Windows did not report a signed TAP driver' }
          $version = & (Join-Path $env:INSTALL_DIR 'openrad.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '2\.4\.5$') { throw 'Unexpected CLI version' }
          Write-Output 'PASS: clean install, signed PnP driver, dedicated TAP adapter, CLI version.'

      - name: Uninstall and confirm dedicated adapter removal
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstall = Join-Path $env:INSTALL_DIR 'Uninstall-OpenRad.exe'
          if (Test-Path -LiteralPath $uninstall) {
            $p = Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -notin @(0,3010)) { throw "Uninstaller failed: $($p.ExitCode)" }
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $adapters = @(Get-NetAdapter -IncludeHidden | Where-Object Name -eq 'OpenRad')
              if (!$adapters.Count) { break }
              Start-Sleep -Seconds 1
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($adapters.Count) { throw 'Dedicated adapter survived uninstall' }
            Write-Output 'PASS: dedicated TAP adapter removed.'
          }

