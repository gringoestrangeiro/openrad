name: Minecraft mod and multiversion Paper (2.2.0)

on:
  push:
    branches:
      - 'release/2.2.0-candidates'
      - 'release/2.2.0'
    paths:
      - 'clients/mod/**'
      - 'clients/plugin/**'
      - 'src/protocol.rs'
      - 'src/crypto.rs'
      - 'src/network.rs'
      - 'tests/fixtures/**'
      - 'scripts/ci-changed-components.py'
      - 'tests/test_minecraft_ci_scope.py'
      - '.github/workflows/minecraft-2.2.0-integration.yml'
  pull_request:
    branches:
      - 'release/2.2.0'
    paths:
      - 'clients/mod/**'
      - 'clients/plugin/**'
      - 'src/protocol.rs'
      - 'src/crypto.rs'
      - 'src/network.rs'
      - 'tests/fixtures/**'
      - 'scripts/ci-changed-components.py'
      - 'tests/test_minecraft_ci_scope.py'
      - '.github/workflows/minecraft-2.2.0-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Minecraft changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fabric: ${{ steps.scope.outputs.fabric }}
      paper: ${{ steps.scope.outputs.paper }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check latest event's changed files (fail closed)
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/ci-changed-components.py

  paper:
    needs: changes
    if: ${{ needs.changes.outputs.paper == 'true' }}
    name: Paper ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.21'
            api: '1.20.6-R0.1-SNAPSHOT'
            java: '21'
          - target: '26.3'
            api: '26.3.build.+'
            java: '25'
    defaults:
      run:
        working-directory: clients/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test, verify bytecode and plugin metadata
        run: ./gradlew --no-daemon --max-workers=1 "-PopenradPaperApi=${{ matrix.api }}" clean check --console=plain
      - name: Keep only verified alpha build (not a release)
        shell: bash
        run: |
          mkdir -p ../../dist/paper
          cp build/libs/OpenRadPlugin.jar "../../dist/paper/OpenRadPlugin-2.2.0-paper-${{ matrix.target }}-java${{ matrix.java }}.jar"
          (cd ../../dist/paper && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: paper-2.2.0-${{ matrix.target }}-build-test
          path: dist/paper/
          if-no-files-found: error
          retention-days: 7

  fabric:
    needs: changes
    if: ${{ needs.changes.outputs.fabric == 'true' }}
    name: Fabric ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.21.1'
            modern: false
          - target: '1.21.11'
            modern: false
          - target: '26.3'
            modern: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared VPN core and build matching Fabric JAR
        if: ${{ !matrix.modern }}
        working-directory: clients/mod
        run: ./gradlew --no-daemon --max-workers=1 "-PopenradMinecraftVersion=${{ matrix.target }}" :core:test :fabric:build :fabric:test --console=plain
      - name: Build Fabric 26.x adapter on Java 25
        if: ${{ matrix.modern }}
        working-directory: clients/mod/modern
        run: ./gradlew --no-daemon --max-workers=1 "-PopenradMinecraftVersion=${{ matrix.target }}" build --console=plain
      - name: Inspect Minecraft-specific JARs
        shell: bash
        env:
          MC: ${{ matrix.target }}
          MODERN: ${{ matrix.modern }}
        run: |
          set -euo pipefail
          mkdir -p dist/fabric
          if [ "$MODERN" = true ]; then
            source="clients/mod/modern/build/libs/OpenRadClientMod-2.2.0-modern-$MC.jar"
          else
            source="clients/mod/fabric/build/libs/fabric-2.2.0.jar"
          fi
          test -s "$source"
          python3 clients/mod/tools/verify-version-jar.py "$source" "$MC" 2.2.0
          cp "$source" "dist/fabric/OpenRadClientMod-2.2.0-fabric-$MC.jar"
          (cd dist/fabric && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-2.2.0-${{ matrix.target }}-build-test
          path: dist/fabric/
          if-no-files-found: error
          retention-days: 7

  # Exercita o jogo real, nao apenas bytecode: perfil e TUN isolados/desligados.
  fabric-runtime-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.fabric == 'true' }}
    name: Fabric 1.21.1 real client smoke (offline)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software OpenGL and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libasound2 libpulse0
      - name: Launch Minecraft via Fabric with no VPN identity or user profile
        working-directory: clients/mod
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 17m xvfb-run -a ./gradlew --no-daemon --max-workers=1 \
            '-PopenradSmoke=true' '-PopenradMinecraftVersion=1.21.1' \
            ':fabric:runSmokeClient' --console=plain | tee runtime-smoke.log
          test -f fabric/run-smoke/openrad-smoke-result.txt
          grep -q '^PASS: required mixins' fabric/run-smoke/openrad-smoke-result.txt
          grep -q 'OPENRAD_SMOKE RESULT PASS' runtime-smoke.log
      - name: Preserve smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrad-2.2.0-minecraft-1.21.1-runtime-smoke
          path: |
            clients/mod/runtime-smoke.log
            clients/mod/fabric/run-smoke/openrad-smoke-result.txt
            clients/mod/fabric/run-smoke/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
