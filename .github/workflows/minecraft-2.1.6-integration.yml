name: Minecraft mod and multiversion Paper (2.1.6)

on:
  push:
    branches:
      - 'release/2.1.6-candidates'
      - 'release/2.1.6'
    paths:
      - 'clients/mod/**'
      - 'clients/plugin/**'
      - '.github/workflows/minecraft-2.1.6-integration.yml'
  pull_request:
    branches:
      - 'release/2.1.6'
    paths:
      - 'clients/mod/**'
      - 'clients/plugin/**'
      - '.github/workflows/minecraft-2.1.6-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Paper ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.21'
            api: '1.20.6-R0.1-SNAPSHOT'
            java: '21'
          - target: '26.3'
            api: '26.3.build.+'
            java: '25'
    defaults:
      run:
        working-directory: clients/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test, verify bytecode and plugin metadata
        run: ./gradlew --no-daemon --max-workers=1 "-PopenradPaperApi=${{ matrix.api }}" clean check --console=plain
      - name: Keep only verified alpha build (not a release)
        shell: bash
        run: |
          mkdir -p ../../dist/paper
          cp build/libs/OpenRadPlugin.jar "../../dist/paper/OpenRadPlugin-2.1.6-paper-${{ matrix.target }}-java${{ matrix.java }}.jar"
          (cd ../../dist/paper && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: paper-2.1.6-${{ matrix.target }}-build-test
          path: dist/paper/
          if-no-files-found: error
          retention-days: 7

  fabric:
    name: Fabric ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.21.1'
            modern: false
          - target: '1.21.11'
            modern: false
          - target: '26.3'
            modern: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared VPN core and build matching Fabric JAR
        if: ${{ !matrix.modern }}
        working-directory: clients/mod
        run: ./gradlew --no-daemon --max-workers=1 "-PopenradMinecraftVersion=${{ matrix.target }}" :core:test :fabric:build :fabric:test --console=plain
      - name: Build Fabric 26.x adapter on Java 25
        if: ${{ matrix.modern }}
        working-directory: clients/mod/modern
        run: ./gradlew --no-daemon --max-workers=1 "-PopenradMinecraftVersion=${{ matrix.target }}" build --console=plain
      - name: Inspect Minecraft-specific JARs
        shell: bash
        env:
          MC: ${{ matrix.target }}
          MODERN: ${{ matrix.modern }}
        run: |
          set -euo pipefail
          mkdir -p dist/fabric
          if [ "$MODERN" = true ]; then
            source="clients/mod/modern/build/libs/OpenRadClientMod-2.1.6-modern-$MC.jar"
          else
            source="clients/mod/fabric/build/libs/fabric-2.1.6.jar"
          fi
          test -s "$source"
          python3 clients/mod/tools/verify-version-jar.py "$source" "$MC" 2.1.6
          cp "$source" "dist/fabric/OpenRadClientMod-2.1.6-fabric-$MC.jar"
          (cd dist/fabric && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-2.1.6-${{ matrix.target }}-build-test
          path: dist/fabric/
          if-no-files-found: error
          retention-days: 7
