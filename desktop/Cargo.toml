[package]
name = "openrad-desktop"
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Native OpenRad desktop VPN client"

[dependencies]
openrad-client = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wgpu_no_default_features", "default_fonts", "x11", "wayland", "accesskit"] }
keyring = "4.2.0"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
log = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(not(windows))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "metal"] }

[dev-dependencies]
skrifa = "0.44.0"
pollster = "1.0.1"
