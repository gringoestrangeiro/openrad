[package]
name = "openrad-desktop"
version = "0.8.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "Native OpenRad desktop VPN client"

[dependencies]
openrad-client = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
keyring = "4.2.0"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
