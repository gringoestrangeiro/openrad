[package]
name = "openrad-client"
version = "1.3.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Open-source Rust reimplementation of Radmin VPN"

[workspace]
members = ["desktop"]
default-members = [".", "desktop"]
resolver = "2"

[lib]
name = "openrad"

[[bin]]
name = "openrad"
path = "src/main.rs"

[[bin]]
name = "openrad-setup-helper"
path = "src/setup_main.rs"

[dependencies]
aes = "0.8.4"
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
directories = "6"
ctrlc = { version = "3", features = ["termination"] }
hex = "0.4"
keyring = "4.2.0"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
md4 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
socket2 = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation"] }
